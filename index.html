<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Slip Bagi Hasil Teknisi - Madinah Flash</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel/CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- JSZip for ZIP creation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- html2pdf for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .slip-preview {
            width: 190mm;
            min-height: 260mm;
            background: #ffffff;
            padding: 12mm 15mm;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #1e293b;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header App -->
        <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <img src="asset/LOGO1.png" alt="Logo 1" class="h-10 object-contain onError='this.style.display=\"none\"'">
                <img src="asset/LOGO2.png" alt="Logo 2" class="h-10 object-contain onError='this.style.display=\"none\"'">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-900">Slip Bagi Hasil Teknisi</h1>
                    <p class="text-xs text-slate-500">Madinah Group Indonesia — MFlash</p>
                </div>
            </div>
            <div id="actionArea" class="hidden flex items-center gap-3">
                <button onclick="generateAllPDFsAndZip()" id="btnZip" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Download Semua Slip (ZIP)</span>
                </button>
                <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2.5 rounded-xl shadow-sm transition-all flex items-center gap-2">
                    <span>Ganti File</span>
                    <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" class="hidden" onchange="handleFileSelect(event)">
                </label>
            </div>
        </header>

        <!-- Dropzone Kosong (Awal) -->
        <div id="uploadDropzone" class="bg-white border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-2xl p-12 text-center transition-all cursor-pointer shadow-sm">
            <input type="file" id="dropzoneInput" accept=".csv, .xlsx, .xls" class="hidden" onchange="handleFileSelect(event)">
            <div onclick="document.getElementById('dropzoneInput').click()" class="space-y-4">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <div>
                    <p class="text-lg font-semibold text-slate-800">Unggah File RAW (CSV / Excel)</p>
                    <p class="text-sm text-slate-500 mt-1">Klik di sini atau tarik file ke dalam kotak ini</p>
                </div>
                <span class="inline-block bg-slate-100 text-slate-600 text-xs px-3 py-1 rounded-full font-medium">Format: .csv, .xlsx, .xls</span>
            </div>
        </div>

        <!-- Info Cabang & Periode -->
        <div id="metadataCard" class="hidden bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <span id="badgeCabang" class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 font-bold text-xs rounded-full uppercase tracking-wider">Cabang -</span>
                <p id="labelPeriode" class="text-sm font-medium text-slate-600 mt-1">Periode: -</p>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400 block">Total Teknisi Ditemukan</span>
                <span id="labelTotalTeknisi" class="text-xl font-bold text-slate-800">0 Orang</span>
            </div>
        </div>

        <!-- Progress Generator ZIP -->
        <div id="progressBox" class="hidden bg-indigo-50 border border-indigo-200 rounded-2xl p-6 text-center space-y-3">
            <p id="progressText" class="font-semibold text-indigo-900 text-sm">Sedang memproses PDF...</p>
            <div class="w-full bg-indigo-200 rounded-full h-3 overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Container Tampilan Slip Teknisi -->
        <div id="teknisiContainer" class="space-y-8"></div>
    </div>

    <!-- Hidden Printable Container for html2pdf -->
    <div id="pdfRenderArea" class="fixed -left-[9999px] top-0"></div>

    <script>
        let parsedTeknisiList = [];
        let globalCabang = "";
        let globalPeriode = "";

        const formatRupiah = (val) => 'Rp ' + (parseFloat(val) || 0).toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        const formatPercent = (val) => (parseFloat(val) || 0).toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                processDataRows(jsonData);
            };
            reader.readAsArrayBuffer(file);
        }

        function processDataRows(rows) {
            if (!rows || rows.length === 0) return;

            // 1. Ambil Informasi Header/Judul
            const row0 = (rows[0] && rows[0][0]) ? String(rows[0][0]) : "";
            const row1 = (rows[1] && rows[1][0]) ? String(rows[1][0]) : "";

            const cabangMatch = row0.match(/Cabang\s+([A-Za-z0-9_ -]+)/i);
            globalCabang = cabangMatch ? cabangMatch[1].trim() : "BINTARA";

            const periodeMatch = row1.match(/Periode:\s*([^·\n]+)/i);
            globalPeriode = periodeMatch ? periodeMatch[1].trim() : "24 Juli 2026 – 23 Agustus 2026";

            // Update Metadata UI
            document.getElementById('badgeCabang').textContent = `Cabang ${globalCabang}`;
            document.getElementById('labelPeriode').textContent = `Periode: ${globalPeriode}`;

            // 2. Cari Baris Header Utama
            let headerIdx = -1;
            for (let i = 0; i < rows.length; i++) {
                if (rows[i].some(cell => String(cell).trim() === 'Nama Teknisi')) {
                    headerIdx = i;
                    break;
                }
            }

            if (headerIdx === -1) {
                alert("Header 'Nama Teknisi' tidak ditemukan pada file!");
                return;
            }

            const headers = rows[headerIdx].map(h => String(h).trim());

            // 3. Deteksi Kolom Potongan Dinamis (antara 'Efektif %' dan 'Gaji Teknisi')
            const idxEfektif = headers.indexOf('Efektif %');
            const idxGaji = headers.indexOf('Gaji Teknisi');

            let potonganHeaders = [];
            if (idxEfektif !== -1 && idxGaji !== -1 && idxGaji > idxEfektif) {
                potonganHeaders = headers.slice(idxEfektif + 1, idxGaji);
            }

            const kualifikasiList = ['Interface', 'Normal', 'Mati Total', 'Promo', 'Lainnya'];
            parsedTeknisiList = [];

            // 4. Extract Data per Teknisi
            for (let r = headerIdx + 1; r < rows.length; r++) {
                const row = rows[r];
                const nama = row[headers.indexOf('Nama Teknisi')];
                if (!nama || String(nama).trim().toUpperCase() === 'TOTAL') continue;

                const item = {
                    nama: String(nama).trim(),
                    cabang: row[headers.indexOf('Cabang')] || globalCabang,
                    omzetTotal: parseFloat(row[headers.indexOf('Omzet Jasa (Total)')]) || 0,
                    bagiHasilTotal: parseFloat(row[headers.indexOf('Bagi Hasil (Aturan)')]) || 0,
                    totalPotongan: parseFloat(row[headers.indexOf('Total Potongan')]) || 0,
                    nettBagiHasil: parseFloat(row[headers.indexOf('Nett Bagi hasil')]) || 0,
                    kualifikasi: [],
                    potonganList: []
                };

                // Kualifikasi Omzet
                kualifikasiList.forEach(kual => {
                    const omzetVal = parseFloat(row[headers.indexOf(`Omzet ${kual}`)]) || 0;
                    const bhVal = parseFloat(row[headers.indexOf(`Bagi Hasil ${kual}`)]) || 0;
                    const pct = omzetVal > 0 ? (bhVal / omzetVal) * 100 : 0;

                    if (omzetVal > 0 || bhVal > 0) {
                        item.kualifikasi.push({
                            nama: kual,
                            omzet: omzetVal,
                            bagiHasil: bhVal,
                            persen: pct
                        });
                    }
                });

                // Potongan Dinamis
                potonganHeaders.forEach(dHead => {
                    const hIndex = headers.indexOf(dHead);
                    const val = parseFloat(row[hIndex]) || 0;
                    item.potonganList.push({
                        namaHeader: dHead,
                        nilai: val
                    });
                });

                parsedTeknisiList.push(item);
            }

            // Unhide Cards & Action Area
            document.getElementById('uploadDropzone').classList.add('hidden');
            document.getElementById('metadataCard').classList.remove('hidden');
            document.getElementById('actionArea').classList.remove('hidden');
            document.getElementById('labelTotalTeknisi').textContent = `${parsedTeknisiList.length} Orang`;

            renderTeknisiUI();
        }

        function buildSlipHTML(t) {
            let kualifikasiRowsHTML = t.kualifikasi.map(k => `
                <tr style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 7px 10px; font-weight: 500; color: #334155;">${k.nama}</td>
                    <td style="padding: 7px 10px; text-align: right; color: #334155;">${formatRupiah(k.omzet)}</td>
                    <td style="padding: 7px 10px; text-align: center; color: #334155;">${formatPercent(k.persen)}</td>
                    <td style="padding: 7px 10px; text-align: right; font-weight: 600; color: #0f172a;">${formatRupiah(k.bagiHasil)}</td>
                </tr>
            `).join('');

            let potonganRowsHTML = t.potonganList.map(p => `
                <tr style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 6px 10px; color: #475569;">${p.namaHeader}</td>
                    <td style="padding: 6px 10px; text-align: right; font-weight: 500; color: ${p.nilai > 0 ? '#b91c1c' : '#64748b'};">
                        ${formatRupiah(p.nilai)}
                    </td>
                </tr>
            `).join('');

            return `
                <div class="slip-preview border rounded-xl shadow-lg mx-auto bg-white">
                    <!-- Header Logo -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <img src="asset/LOGO1.png" style="height: 44px; object-fit: contain;" alt="Madinah Group">
                        <img src="asset/LOGO2.png" style="height: 44px; object-fit: contain;" alt="MFlash">
                    </div>

                    <!-- Judul Document -->
                    <div style="text-align: center; margin-bottom: 18px; border-bottom: 2px solid #0284c7; padding-bottom: 6px;">
                        <h2 style="margin: 0; font-size: 13pt; font-weight: bold; letter-spacing: 0.5px; color: #0f172a;">
                            SLIP BAGI HASIL TEKNISI MADINAH FLASH
                        </h2>
                    </div>

                    <!-- Metadata -->
                    <table style="width: 100%; margin-bottom: 16px; font-size: 10pt; border-collapse: collapse;">
                        <tr>
                            <td style="width: 80px; padding: 2px 0; font-weight: bold; color: #475569;">Nama</td>
                            <td style="width: 15px; padding: 2px 0;">:</td>
                            <td style="padding: 2px 0; font-weight: bold; color: #0f172a;">${t.nama}</td>
                        </tr>
                        <tr>
                            <td style="padding: 2px 0; font-weight: bold; color: #475569;">Jabatan</td>
                            <td style="padding: 2px 0;">:</td>
                            <td style="padding: 2px 0; color: #334155;">Teknisi</td>
                        </tr>
                        <tr>
                            <td style="padding: 2px 0; font-weight: bold; color: #475569;">Divisi</td>
                            <td style="padding: 2px 0;">:</td>
                            <td style="padding: 2px 0; color: #334155;">MFlash — ${t.cabang}</td>
                        </tr>
                        <tr>
                            <td style="padding: 2px 0; font-weight: bold; color: #475569;">Periode</td>
                            <td style="padding: 2px 0;">:</td>
                            <td style="padding: 2px 0; color: #334155;">${globalPeriode}</td>
                        </tr>
                    </table>

                    <!-- Table 1: Pendapatan -->
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 9.5pt;">
                        <thead>
                            <tr style="background-color: #f1f5f9; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;">
                                <th style="padding: 7px 10px; text-align: left; font-weight: bold; color: #0f172a; width: 45%;">PENDAPATAN PER KUALIFIKASI</th>
                                <th style="padding: 7px 10px; text-align: right; font-weight: bold; color: #0f172a; width: 22%;">OMZET</th>
                                <th style="padding: 7px 10px; text-align: center; font-weight: bold; color: #0f172a; width: 13%;">AKAD</th>
                                <th style="padding: 7px 10px; text-align: right; font-weight: bold; color: #0f172a; width: 20%;">BAGI HASIL</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${kualifikasiRowsHTML}
                        </tbody>
                        <tfoot>
                            <tr style="border-top: 1.5px solid #cbd5e1; border-bottom: 1.5px solid #cbd5e1; background-color: #f8fafc; font-weight: bold;">
                                <td colspan="3" style="padding: 7px 10px; text-align: left; color: #0f172a;">Total Bruto Bagi Hasil</td>
                                <td style="padding: 7px 10px; text-align: right; color: #0f172a;">${formatRupiah(t.bagiHasilTotal)}</td>
                            </tr>
                        </tfoot>
                    </table>

                    <!-- Table 2: Potongan -->
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 9.5pt;">
                        <thead>
                            <tr style="background-color: #f1f5f9; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;">
                                <th style="padding: 7px 10px; text-align: left; font-weight: bold; color: #0f172a; width: 80%;">POTONGAN</th>
                                <th style="padding: 7px 10px; text-align: right; font-weight: bold; color: #0f172a; width: 20%;">JUMLAH</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${potonganRowsHTML}
                        </tbody>
                        <tfoot>
                            <tr style="border-top: 1.5px solid #cbd5e1; border-bottom: 1.5px solid #cbd5e1; background-color: #f8fafc; font-weight: bold;">
                                <td style="padding: 7px 10px; text-align: left; color: #0f172a;">Total Potongan</td>
                                <td style="padding: 7px 10px; text-align: right; color: #b91c1c;">${formatRupiah(t.totalPotongan)}</td>
                            </tr>
                        </tfoot>
                    </table>

                    <!-- Box Nett Bagi Hasil -->
                    <div style="background-color: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 8px 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: bold; font-size: 10.5pt; color: #0f172a;">NETT BAGI HASIL</span>
                        <span style="font-weight: bold; font-size: 11.5pt; color: #15803d;">${formatRupiah(t.nettBagiHasil)}</span>
                    </div>

                    <!-- Catatan & Tanda Tangan -->
                    <div style="margin-top: 20px;">
                        <p style="font-size: 9pt; font-weight: bold; color: #475569; margin-bottom: 35px;">Catatan :</p>
                        <div style="display: flex; justify-content: space-around; text-align: center; font-size: 9.5pt; font-weight: bold; color: #334155;">
                            <div>
                                <div style="height: 45px;"></div>
                                <div>Teknisi</div>
                            </div>
                            <div>
                                <div style="height: 45px;"></div>
                                <div>Kepala Cabang</div>
                            </div>
                            <div>
                                <div style="height: 45px;"></div>
                                <div>Finance</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTeknisiUI() {
            const container = document.getElementById('teknisiContainer');
            container.innerHTML = '';

            parsedTeknisiList.forEach((t, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = "bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4";

                wrapper.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900">${t.nama}</h3>
                            <p class="text-xs text-slate-500">Cabang ${t.cabang} • Nett Bagi Hasil: <span class="font-bold text-emerald-600">${formatRupiah(t.nettBagiHasil)}</span></p>
                        </div>
                        <button onclick="downloadSinglePDF(${idx})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold text-xs px-4 py-2 rounded-lg transition-all flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <span>Download PDF Slip</span>
                        </button>
                    </div>
                    <div class="overflow-x-auto flex justify-center py-2 bg-slate-50/50 rounded-xl">
                        ${buildSlipHTML(t)}
                    </div>
                `;
                container.appendChild(wrapper);
            });
        }

        async function downloadSinglePDF(index) {
            const t = parsedTeknisiList[index];
            if (!t) return;

            const renderArea = document.getElementById('pdfRenderArea');
            renderArea.innerHTML = buildSlipHTML(t);

            const opt = {
                margin: 5,
                filename: `${globalCabang} - ${t.nama}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            await html2pdf().set(opt).from(renderArea.firstElementChild).save();
            renderArea.innerHTML = '';
        }

        async function generateAllPDFsAndZip() {
            if (parsedTeknisiList.length === 0) return;

            const zip = new JSZip();
            const renderArea = document.getElementById('pdfRenderArea');
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressBox.classList.remove('hidden');
            document.getElementById('btnZip').disabled = true;

            for (let i = 0; i < parsedTeknisiList.length; i++) {
                const t = parsedTeknisiList[i];
                const pct = Math.round(((i + 1) / parsedTeknisiList.length) * 100);

                progressText.textContent = `Membuat PDF (${i + 1}/${parsedTeknisiList.length}): ${t.nama}...`;
                progressBar.style.width = `${pct}%`;

                renderArea.innerHTML = buildSlipHTML(t);

                const opt = {
                    margin: 5,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                const worker = html2pdf().set(opt).from(renderArea.firstElementChild);
                const pdfBlob = await worker.output('blob');

                const fileName = `${globalCabang} - ${t.nama}.pdf`;
                zip.file(fileName, pdfBlob);

                renderArea.innerHTML = '';
            }

            progressText.textContent = "Mengompresi file ke dalam ZIP...";
            const zipBlob = await zip.generateAsync({ type: "blob" });

            // Trigger Download ZIP
            const link = document.createElement('a');
            link.href = URL.createObjectURL(zipBlob);
            link.download = `Slip_Bagi_Hasil_${globalCabang}_${globalPeriode.replace(/[^a-zA-Z0-9]/g, '_')}.zip`;
            link.click();

            progressBox.classList.add('hidden');
            document.getElementById('btnZip').disabled = false;
        }
    </script>
</body>
</html>
